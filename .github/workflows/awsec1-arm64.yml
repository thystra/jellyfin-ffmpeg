name: awsec1 arm64 build and qualification

on:
  push:
    branches:
      - 7.1.4-3-awsec1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awsec1-ffmpeg7-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qualify-publish:
    name: trixie-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make mmv

      - name: Build Trixie arm64 package
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          ./build trixie arm64 "$GITHUB_WORKSPACE/artifacts"

      - name: Verify package metadata
        run: |
          set -euxo pipefail

          DEB="artifacts/jellyfin-ffmpeg7_7.1.4-3+awsec1-trixie_arm64.deb"
          test -f "$DEB"
          test -f artifacts/jellyfin-ffmpeg_7.1.4-3+awsec1-trixie_arm64.buildinfo
          test -f artifacts/jellyfin-ffmpeg_7.1.4-3+awsec1-trixie_arm64.changes

          test "$(dpkg-deb -f "$DEB" Package)" = "jellyfin-ffmpeg7"
          test "$(dpkg-deb -f "$DEB" Version)" = "7.1.4-3+awsec1-trixie"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "arm64"

      - name: Qualify hardened FFmpeg under arm64
        run: |
          set -euxo pipefail

          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts:ro" \
            debian:trixie-slim \
            sh -c '
              set -eu
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y \
                /artifacts/jellyfin-ffmpeg7_7.1.4-3+awsec1-trixie_arm64.deb

              echo "===== PACKAGE ====="
              dpkg-query -W -f="\${Package} \${Version} \${Architecture}\n" jellyfin-ffmpeg7

              echo "===== VERSION ====="
              /usr/lib/jellyfin-ffmpeg/ffmpeg -version \
                | head -1 \
                | grep -F "7.1.4-Jellyfin"

              echo "===== MAGICYUV ====="
              if /usr/lib/jellyfin-ffmpeg/ffmpeg \
                   -hide_banner -decoders 2>/dev/null \
                   | grep -qi magicyuv
              then
                echo "FAIL: MagicYUV decoder present"
                exit 1
              fi
              echo "PASS: MagicYUV decoder absent"

              echo "===== HWACCELS ====="
              HW="$(/usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -hwaccels 2>/dev/null)"
              printf "%s\n" "$HW"
              for accel in cuda drm opencl
              do
                printf "%s\n" "$HW" | grep -qx "$accel"
              done

              echo "===== RKMPP ====="
              /usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -decoders 2>/dev/null \
                | grep -q h264_rkmpp

              echo "===== ENCODE TEST ====="
              /usr/lib/jellyfin-ffmpeg/ffmpeg \
                -hide_banner \
                -f lavfi \
                -i "testsrc=size=320x180:rate=15" \
                -t 1 \
                -c:v libx264 \
                -f null -
            '

      - name: Update existing AWSEC1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v7.1.4-3-awsec1
        run: |
          set -euxo pipefail

          mkdir -p release-assets existing
          gh release download "$TAG" --dir existing
          rm -f existing/SHA256SUMS
          cp existing/* release-assets/
          cp artifacts/*.deb artifacts/*.changes artifacts/*.buildinfo release-assets/

          cd release-assets
          sha256sum *.deb *.changes *.buildinfo > SHA256SUMS
          cat SHA256SUMS

          gh release upload "$TAG" \
            jellyfin-ffmpeg7_7.1.4-3+awsec1-trixie_arm64.deb \
            jellyfin-ffmpeg_7.1.4-3+awsec1-trixie_arm64.buildinfo \
            jellyfin-ffmpeg_7.1.4-3+awsec1-trixie_arm64.changes \
            SHA256SUMS \
            --clobber

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-ffmpeg-7.1.4-3-awsec1-trixie-arm64
          path: |
            artifacts/*.deb
            artifacts/*.changes
            artifacts/*.buildinfo
          if-no-files-found: error
