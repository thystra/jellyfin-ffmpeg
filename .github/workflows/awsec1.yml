name: awsec1 ffmpeg8 build and qualification

on:
  push:
    branches:
      - 8.1.2-5-awsec1
  pull_request:
    branches:
      - 8.1.2-5-awsec1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awsec1-ffmpeg8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qualify:
    name: trixie-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            expected_hwaccels: cuda vaapi qsv drm opencl vulkan
          - arch: arm64
            platform: linux/arm64
            expected_hwaccels: cuda vaapi drm opencl vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make mmv

      - name: Build Trixie package
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          ./build trixie "${{ matrix.arch }}" "$GITHUB_WORKSPACE/artifacts"

      - name: Verify package metadata
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          DEB="artifacts/jellyfin-ffmpeg8_8.1.2-5+awsec1-trixie_${ARCH}.deb"
          test -f "$DEB"
          test -f "artifacts/jellyfin-ffmpeg_8.1.2-5+awsec1-trixie_${ARCH}.buildinfo"
          test -f "artifacts/jellyfin-ffmpeg_8.1.2-5+awsec1-trixie_${ARCH}.changes"

          test "$(dpkg-deb -f "$DEB" Package)" = "jellyfin-ffmpeg8"
          test "$(dpkg-deb -f "$DEB" Version)" = "8.1.2-5+awsec1-trixie"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "$ARCH"

      - name: Qualify hardened FFmpeg
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_HWACCELS: ${{ matrix.expected_hwaccels }}
        run: |
          set -euxo pipefail

          docker run --rm \
            --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts:ro" \
            -e ARCH="$ARCH" \
            -e EXPECTED_HWACCELS="$EXPECTED_HWACCELS" \
            debian:trixie-slim \
            sh -c '
              set -eu
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y \
                "/artifacts/jellyfin-ffmpeg8_8.1.2-5+awsec1-trixie_${ARCH}.deb"

              echo "===== PACKAGE ====="
              dpkg-query -W \
                -f="\${Package} \${Version} \${Architecture}\n" \
                jellyfin-ffmpeg8

              echo "===== VERSION ====="
              /usr/lib/jellyfin-ffmpeg/ffmpeg -version \
                | head -1 \
                | grep -F "8.1.2-Jellyfin"

              echo "===== MAGICYUV ====="
              if /usr/lib/jellyfin-ffmpeg/ffmpeg \
                   -hide_banner -decoders 2>/dev/null \
                   | grep -qi magicyuv
              then
                echo "FAIL: MagicYUV decoder present"
                exit 1
              fi
              echo "PASS: MagicYUV decoder absent"

              echo "===== HWACCELS ====="
              HW="$(/usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -hwaccels 2>/dev/null)"
              printf "%s\n" "$HW"
              for accel in $EXPECTED_HWACCELS
              do
                printf "%s\n" "$HW" | grep -qx "$accel"
              done

              echo "===== ENCODE TEST ====="
              /usr/lib/jellyfin-ffmpeg/ffmpeg \
                -hide_banner \
                -f lavfi \
                -i "testsrc=size=320x180:rate=15" \
                -t 1 \
                -c:v libx264 \
                -f null -
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-ffmpeg-8.1.2-5-awsec1-trixie-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.changes
            artifacts/*.buildinfo
          if-no-files-found: error

  publish:
    name: Publish AWSEC1 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/8.1.2-5-awsec1'
    runs-on: ubuntu-24.04
    needs:
      - build-qualify

    steps:
      - name: Download qualified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jellyfin-ffmpeg-8.1.2-5-awsec1-trixie-*
          path: downloaded

      - name: Prepare release assets
        run: |
          set -euxo pipefail
          mkdir release-assets
          find downloaded -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.deb *.changes *.buildinfo > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v8.1.2-5-awsec1
        run: |
          set -euxo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Jellyfin FFmpeg 8.1.2-5+awsec1" \
            --notes "Security-hardened Jellyfin FFmpeg 8.1.2-5 for Jellyfin 12.x. Upstream 8.1.2 already fixes CVE-2026-8461; AWSEC1 additionally disables the MagicYUV decoder as defense in depth. Qualified Debian Trixie packages are published for amd64 and arm64." \
            release-assets/*
