name: retired awsec1 ffmpeg8 experiment

on:
  push:
    branches:
      - 8.1.2-5-awsec1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awsec1-ffmpeg8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain retirement
        run: |
          echo "No derivative FFmpeg 8 build is required for CVE-2026-8461."
          echo "Upstream FFmpeg 8.1.2 already contains the CVE-2026-8461 fixes."
          echo "Use the upstream Jellyfin FFmpeg 8 packages for Jellyfin 12.x."
